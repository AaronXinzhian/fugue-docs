name: GEB regression and self-check
on:
  push:
  pull_request:
jobs:
  geb-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Integration, boundary, accounting and self-checks
        run: python -B evals/run_regression_suite.py --rounds 1
